[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "connections"
version = "0.1.0"
description = "The one shared way to reach IBKR (paper Gateway) and Tiingo, plus the master clientId registry. Everything imports from here so access logic lives in one place and nothing collides."
requires-python = ">=3.11"
dependencies = ["ib_async>=2.0", "pandas>=2.0", "requests>=2.0"]

[tool.setuptools.packages.find]
include = ["connections*"]
