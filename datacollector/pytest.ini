# Restrict test collection to this package's real convention: test_*.py.
#
# pytest's DEFAULT python_files glob also matches *_test.py, which sweeps in two
# hand-run DIAGNOSTIC scripts that are not tests and read sys.argv[1] at import
# (ibkr_option_stream_test.py, ibkr_stream_test.py) — so a bare `pytest -q` here
# died at COLLECTION with "invalid literal for int() ... '-q'" before running a
# single test. Every real test in datacollector\ is named test_*.py, so narrowing
# the glob fixes the root cause without renaming or blacklisting those scripts by
# name (they stay runnable by hand exactly as before).
[pytest]
python_files = test_*.py
